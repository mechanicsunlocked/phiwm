# phiwm — dwindle tiling for Windows 11, configured like hyprland.conf
# This file is reloaded automatically when you save it.
# Location: %USERPROFILE%\.config\phiwm\phiwm.conf
# Log:      %LOCALAPPDATA%\phiwm\phiwm.log

$terminal    = wt.exe
$browser     = msedge.exe
$fileManager = explorer.exe
$mainMod     = SUPER

general {
    gaps_in  = 5
    gaps_out = 10
    # Window border color (Windows 11 draws it natively; gradients use the first color)
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    # 0 = square corners, anything else = Windows 11 rounded corners
    rounding = 10
}

dwindle {
    # Hyprland scale: 1.0 = 50/50. 1.236 = golden ratio (existing window keeps 61.8%)
    default_split_ratio = 1.236
    # 0 = new window goes to the side of the mouse, 1 = left/top, 2 = right/bottom
    force_split = 2
    preserve_split = true
    split_width_multiplier = 1.0
}

input {
    # 1 = focus follows mouse (uses the Windows "activate window by hovering" setting
    # for this session only), 0 = click to focus
    follow_mouse = 0
}

# Programs to start with phiwm
# exec-once = C:\Tools\something.exe

# ---- Window rules (class matches the window class or the exe name) ----
windowrule = float, title:^(Picture-in-Picture|Picture in picture)$
windowrule = float, exe:^(CalculatorApp\.exe)$
windowrule = float, class:^(OperationStatusWindow)$
windowrule = float, exe:^(PowerToys\..*)$
# windowrule = workspace 3 silent, exe:^(Spotify\.exe)$

# ---- Apps ----
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager

# ---- Windows ----
bind = $mainMod, W, killactive
bind = $mainMod, J, togglesplit
bind = $mainMod, P, pseudo
# Note: this replaces Win+V clipboard history
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = $mainMod SHIFT, left,  swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up,    swapwindow, u
bind = $mainMod SHIFT, down,  swapwindow, d

binde = $mainMod, minus, resizeactive, -100 0
binde = $mainMod, equal, resizeactive, 100 0
binde = $mainMod SHIFT, minus, resizeactive, 0 -100
binde = $mainMod SHIFT, equal, resizeactive, 0 100

bind = $mainMod ALT, TAB, cyclenext
bind = $mainMod ALT SHIFT, TAB, cyclenext, prev

# ---- Workspaces (code:10..19 = the 1..0 keys on any layout) ----
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1

# ---- phiwm ----
bind = $mainMod CTRL, R, reload
bind = $mainMod CTRL SHIFT, Q, exit
